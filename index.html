<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="/icons/icon192.png" type="image/png">
<link rel="icon" href="/favicon.ico" type="image/x-icon">
<meta name="theme-color" content="#00ff66">
    <title>Equanta - Movies &amp; TV Shows</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Header Navigation -->
    <header class="header" id="header">
        <div class="header-content">
            <div class="header-left">
                <div class="logo">Equanta</div>
                <nav class="nav-links">
                    <a href="#" class="nav-link active" data-section="home">Home</a>
                    <a href="#" class="nav-link" data-section="movies">Movies</a>
                    <a href="#" class="nav-link" data-section="tv">TV Shows</a>
                    <a href="#" class="nav-link" data-section="trending">Trending</a>
                </nav>
            </div>
            <div class="header-right">
                <div class="search-container">
                    <button class="search-toggle" id="searchToggle">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="11" cy="11" r="8"></circle>
                            <path d="M21 21l-4.35-4.35"></path>
                        </svg>
                    </button>
                    <div class="search-box" id="searchBox">
                        <input type="text" id="searchInput" placeholder="Search movies, TV shows..." autocomplete="off">
                    </div>
                </div>
            </div>
        </div>
    </header>
<footer>
  <a href="privacy policy.html">Privacy Policy</a>
</footer>

    <!-- Hero Banner Section -->
    <section class="hero" id="heroBanner">
        <div class="hero-content">
            <h1 class="hero-title" id="heroTitle">Loading...</h1>
            <p class="hero-overview" id="heroOverview"></p>
            <div class="hero-buttons">
                <button class="btn btn-play" id="heroPlay">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M8 5v14l11-7z"/>
                    </svg>
                    Play
                </button>
                <button class="btn btn-info" id="heroInfo">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"></circle>
                        <line x1="12" y1="16" x2="12" y2="12"></line>
                        <line x1="12" y1="8" x2="12.01" y2="8"></line>
                    </svg>
                    More Info
                </button>
            </div>
        </div>
        <div class="hero-fade"></div>
    </section>

    <!-- Search Results Section -->
    <section class="search-results" id="searchResults" style="display: none;">
        <div class="content-container">
            <h2 class="search-results-title">Search Results</h2>
            <div class="search-results-grid" id="searchResultsGrid"></div>
        </div>
    </section>

    <!-- Main Content Rows -->
    <main class="main-content" id="mainContent">
        <div class="content-container">
            <!-- Content rows will be dynamically inserted here -->
        </div>
    </main>

    <!-- Loading Spinner -->
    <div class="loading-spinner" id="loadingSpinner">
        <div class="spinner"></div>
    </div>

    <!-- Detail Modal -->
    <div class="modal" id="detailModal">
        <div class="modal-overlay" id="modalOverlay"></div>
        <div class="modal-content" id="modalContent">
            <button class="modal-close" id="modalClose">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
            <div class="modal-body" id="modalBody">
                <!-- Modal content will be dynamically inserted -->
            </div>
        </div>

    </div>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker
      .register("/service-worker.js")
      .then(reg => console.log("Service Worker registered", reg))
      .catch(err => console.error("Service Worker failed:", err));
  });
}
</script>
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Organization",
  "name": "Equanta",
  "url": "https://equanta.run.place",
  "logo": "https://equanta.run.place/icons/icon512.png"
}
</script>

    <!-- JavaScript Files -->
    <script src="api.js"></script>
    <script src="ui.js"></script>
    <script src="player.js"></script>
    <script src="modal.js"></script>
    <script src="search.js"></script>
    <script src="main.js"></script>
</body>
</html>
